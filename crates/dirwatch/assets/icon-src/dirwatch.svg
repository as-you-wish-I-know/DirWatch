  </defs>
  <path d="M16 60 q0 -14 14 -14 h56 q10 0 16 8 l8 10 h116 q14 0 14 14 v116 q0 14 -14 14 H30 q-14 0 -14 -14 Z" fill="url(#backGrad2)"/>
