<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Simplified art for 16/24/32 px: bigger eye, thicker shapes, no fine detail -->
  <defs>
    <linearGradient id="backGradS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dda032"/>
      <stop offset="1" stop-color="#b57a18"/>
    </linearGradient>
    <linearGradient id="frontGradS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdf8a"/>
      <stop offset="1" stop-color="#eda72f"/>
    </linearGradient>
    <radialGradient id="irisS" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#8fb8dd"/>
      <stop offset="0.5" stop-color="#2b6ca8"/>
      <stop offset="1" stop-color="#0d2f52"/>
    </radialGradient>
  </defs>

  <!-- folder back + tab -->
  <path d="M12 56 q0 -16 16 -16 h60 q11 0 18 9 l9 11 h113 q16 0 16 16 v116 q0 16 -16 16 H28 q-16 0 -16 -16 Z" fill="url(#backGradS)"/>
  <!-- folder front panel -->
  <rect x="12" y="82" width="232" height="126" rx="16" fill="url(#frontGradS)"/>

  <!-- sclera: wide almond -->
  <path d="M36 146 Q128 88 220 146 Q128 204 36 146 Z" fill="#ffffff"/>
  <path d="M36 146 Q128 88 220 146 Q128 204 36 146 Z" fill="none" stroke="#6e4a10" stroke-width="10" stroke-linejoin="round"/>

  <!-- iris -->
  <circle cx="128" cy="146" r="42" fill="url(#irisS)"/>
  <!-- pupil -->
  <circle cx="128" cy="146" r="19" fill="#06121f"/>
  <!-- catchlight -->
  <circle cx="116" cy="134" r="9" fill="#ffffff"/>
</svg>
